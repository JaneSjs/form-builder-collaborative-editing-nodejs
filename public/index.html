<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurveyJS Creator Real-Time Demo</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/survey-core@2.5.23/survey-core.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/survey-creator-core@2.5.23/survey-creator-core.min.css"
    />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        overflow: hidden;
      }
      .topbar {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid #ddd;
        background: #fafafa;
        flex-wrap: wrap;
      }
      .badge {
        padding: 3px 8px;
        border-radius: 999px;
        background: #eef;
      }
      #status {
        color: #444;
      }
      #surveyCreatorContainer {
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span class="badge">Room: <strong id="roomId"></strong></span>
      <span class="badge">Client: <strong id="clientId"></strong></span>
      <span class="badge">Server version: <strong id="serverVersion">0</strong></span>
      <span id="status">Connecting...</span>
    </div>
    <div id="surveyCreatorContainer"></div>

    <script src="https://unpkg.com/survey-core@2.5.23/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.23/survey.i18n.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.23/themes/index.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui@2.5.23/survey-js-ui.min.js"></script>
    <script src="https://unpkg.com/survey-creator-core@2.5.23/survey-creator-core.min.js"></script>
    <script src="https://unpkg.com/survey-creator-core@2.5.23/survey-creator-core.i18n.min.js"></script>
    <script src="https://unpkg.com/survey-creator-core@2.5.23/themes/index.min.js"></script>
    <script src="https://unpkg.com/survey-creator-js@2.5.23/survey-creator-js.min.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const roomId = params.get("room") || "demo-room";
      const clientId =
        params.get("client") ||
        (window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : "client-" + Math.random().toString(16).slice(2));
      const apiBaseParam = params.get("apiBase");
      const apiBase = (apiBaseParam || location.origin).replace(/\/$/, "");

      document.getElementById("roomId").textContent = roomId;
      document.getElementById("clientId").textContent = clientId;

      const statusEl = document.getElementById("status");
      const serverVersionEl = document.getElementById("serverVersion");

      const creator = new SurveyCreator.SurveyCreator({
        showJSONEditorTab: false
      });
      creator.toolbox.forceCompact = true;
      creator.showLogicTab = true;
      creator.autoSaveEnabled = true;
      
      creator.render("surveyCreatorContainer");

      let isApplyingRemote = false;
      let eventSource = null;
      let lastKnownVersion = 0;
      let pollTimer = null;
      let sseOpened = false;
      let sseFallbackTimer = null;

      function setStatus(message) {
        statusEl.textContent = message;
      }

      async function loadInitial() {
        const res = await fetch(`${apiBase}/api/survey/${encodeURIComponent(roomId)}`);
        const data = await res.json();
        creator.JSON = data.schema || { pages: [] };
        lastKnownVersion = Number(data.version || 0);
        serverVersionEl.textContent = String(lastKnownVersion);
      }

      creator.saveSurveyFunc = function (saveNo, callback) {
        if (isApplyingRemote) {
          callback(saveNo, true);
          return;
        }

        fetch(`${apiBase}/api/survey/${encodeURIComponent(roomId)}/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              clientId,
              saveNo,
              surveyJson: creator.JSON
            })
          })
          .then((res) => res.json())
          .then((data) => {
            if (data.serverVersion != null) {
              lastKnownVersion = Number(data.serverVersion);
              serverVersionEl.textContent = String(lastKnownVersion);
            }

            if (data.ok) {
              setStatus(`Saved #${saveNo} (server v${data.serverVersion})`);
              callback(saveNo, true);
            } else if (data.ignored) {
              setStatus(`Ignored out-of-order #${saveNo}`);
              callback(saveNo, true);
            } else {
              setStatus(`Failed save #${saveNo}: ${data.reason || "unknown"}`);
              callback(saveNo, false);
            }
          })
          .catch(() => {
            setStatus(`Network error on save #${saveNo}`);
            callback(saveNo, false);
          });
      };

      function startPollingFallback() {
        if (pollTimer) {
          return;
        }
        setStatus("Live stream disconnected. Using polling fallback...");
        pollTimer = setInterval(async () => {
          try {
            const res = await fetch(
              `${apiBase}/api/survey/${encodeURIComponent(roomId)}?sinceVersion=${lastKnownVersion}`
            );
            const data = await res.json();
            if (!data.hasUpdate) {
              return;
            }
            if (data.version != null) {
              lastKnownVersion = Number(data.version);
              serverVersionEl.textContent = String(lastKnownVersion);
            }
            isApplyingRemote = true;
            creator.JSON = data.schema || { pages: [] };
            isApplyingRemote = false;
            setStatus("Applied update via polling fallback");
          } catch {
            setStatus("Polling failed. Retrying...");
          }
        }, 2000);
      }

      function stopPollingFallback() {
        if (!pollTimer) {
          return;
        }
        clearInterval(pollTimer);
        pollTimer = null;
      }

      function connectEventStream() {
        if (eventSource) {
          return;
        }

        const streamUrl =
          `${apiBase}/api/stream/${encodeURIComponent(roomId)}` +
          `?clientId=${encodeURIComponent(clientId)}`;
        sseOpened = false;

        if (sseFallbackTimer) {
          clearTimeout(sseFallbackTimer);
          sseFallbackTimer = null;
        }
        sseFallbackTimer = setTimeout(() => {
          if (!sseOpened) {
            startPollingFallback();
          }
        }, 8000);

        eventSource = new EventSource(streamUrl);

        eventSource.onopen = () => {
          sseOpened = true;
          if (sseFallbackTimer) {
            clearTimeout(sseFallbackTimer);
            sseFallbackTimer = null;
          }
          stopPollingFallback();
          setStatus("Connected for live updates (SSE)");
        };

        eventSource.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "room-state") {
            return;
          }
          if (msg.type !== "survey-updated") {
            return;
          }
          if (msg.serverVersion != null) {
            lastKnownVersion = Number(msg.serverVersion);
            serverVersionEl.textContent = String(lastKnownVersion);
          }

          isApplyingRemote = true;
          creator.JSON = msg.surveyJson;
          isApplyingRemote = false;

          setStatus(
            `Applied remote change from ${msg.senderClientId} (save #${msg.saveNo})`
          );
        };

        // Do not close/reconnect manually: native EventSource retries on its own.
        // Closing here caused duplicate streams + spurious "polling fallback".
        eventSource.onerror = () => {
          if (!sseOpened) {
            setStatus("Connecting to live stream…");
          }
        };
      }

      loadInitial().then(connectEventStream);
    </script>
  </body>
</html>
